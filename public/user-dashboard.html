<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evalio | Student Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .dashboard-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            background: var(--glass-bg);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar-logo {
            padding: 0 1.5rem 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .nav-item {
            padding: 1rem 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            color: white;
            background: rgba(79, 70, 229, 0.1);
            border-right: 3px solid var(--primary);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 2rem 3rem;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 500;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        /* Views */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .view-section.active {
            display: block;
        }

        /* Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 1rem;
            color: var(--secondary);
        }

        .exam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .exam-card {
            padding: 1.5rem;
            border-radius: 12px;
            transition: transform 0.3s ease;
            position: relative;
        }
        
        .exam-card:hover {
            transform: translateY(-5px);
        }

        .exam-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .exam-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .data-table th, .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="#" class="sidebar-logo">
                <i class="fa-solid fa-graduation-cap text-gradient"></i> Evalio
            </a>
            <div style="flex: 1;">
                <div class="nav-item active" data-target="dashboard-view">
                    <i class="fa-solid fa-chart-pie"></i> Overview
                </div>
                <div class="nav-item" data-target="available-exams-view">
                    <i class="fa-solid fa-file-pen"></i> Available Testing
                </div>
                <div class="nav-item" data-target="my-results-view">
                    <i class="fa-solid fa-certificate"></i> Exam History
                </div>
            </div>
            <div class="nav-item" id="logoutBtn" style="margin-top: auto;">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <h2 id="pageTitle">Student Overview</h2>
                <div class="user-profile">
                    <span id="userName">Student User</span>
                    <div class="avatar" id="userInitial">S</div>
                </div>
            </div>

            <!-- View: Dashboard -->
            <section id="dashboard-view" class="view-section active">
                <div class="stats-grid">
                    <div class="stat-card glass-panel">
                        <div class="text-secondary">Exams Completed</div>
                        <div class="stat-value" id="statCompleted">0</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <div class="text-secondary">Average Score</div>
                        <div class="stat-value" id="statAvg">0%</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <div class="text-secondary">Pending Exams</div>
                        <div class="stat-value" id="statPending">0</div>
                    </div>
                </div>

                <div class="glass-panel" style="padding: 1.5rem;">
                    <h3>Recent Activity</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Exam Name</th>
                                <th>Score</th>
                                <th>Status</th>
                                <th>Date Taken</th>
                            </tr>
                        </thead>
                        <tbody id="recentActivityBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- View: Available Exams -->
            <section id="available-exams-view" class="view-section">
                <h3 class="mb-8">Pending Examinations</h3>
                <div id="availableExamsContainer" class="exam-grid">
                    <!-- Populated via JS -->
                </div>
            </section>

            <!-- View: My Results -->
            <section id="my-results-view" class="view-section">
                <div class="glass-panel" style="padding: 1.5rem;">
                    <h3>Complete Exam History</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Exam Title</th>
                                <th>Questions</th>
                                <th>My Score</th>
                                <th>Percentage</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="historyListBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/user.js"></script>
</body>
</html>
