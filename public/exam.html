<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evalio | Active Exam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #0B1120;
        }

        .exam-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .exam-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
            margin-top: 2rem;
            padding-bottom: 4rem;
        }

        /* Question Area */
        .question-area {
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .option-label input[type="radio"] {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .option-label.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        /* Question Navigator */
        .q-navigator {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .q-bubble {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .q-bubble:hover {
            border-color: var(--primary);
        }

        .q-bubble.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.3);
        }

        .q-bubble.answered {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .exam-layout {
                grid-template-columns: 1fr;
            }
            .sidebar-nav {
                grid-row: 1;
            }
        }
    </style>
</head>
<body>

    <header class="exam-header">
        <div class="container flex justify-between items-center">
            <div style="font-weight: 600;" id="headerExamTitle">Loading Exam...</div>
            <div class="timer-box" id="timerBox">
                <i class="fa-regular fa-clock"></i> <span id="timeRemaining">--:--</span>
            </div>
            <button class="btn btn-outline" id="finishExamBtnTop">Submit Exam</button>
        </div>
    </header>

    <main class="container exam-layout animate-fade-in">
        
        <!-- Left: Question Area -->
        <div class="glass-panel question-area" style="padding: 2rem;">
            <div class="question-header">
                <h3 id="questionNumText">Question 1</h3>
                <span class="badge" style="background: rgba(255,255,255,0.1);" id="questionMarks">10 Marks</span>
            </div>
            
            <div class="question-text" id="questionText">
                <!-- Question text here -->
            </div>

            <div class="options-list" id="optionsContainer">
                <!-- Radio options injected here -->
            </div>

            <div class="controls">
                <button class="btn btn-outline" id="prevBtn"><i class="fa-solid fa-arrow-left"></i> Previous</button>
                <button class="btn btn-primary" id="nextBtn" style="padding: 10px 40px;">Next <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Right: Navigation Sidebar -->
        <div class="sidebar-nav">
            <div class="glass-panel" style="padding: 1.5rem;">
                <h4 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Question Navigator</h4>
                
                <div class="q-navigator" id="qNavigator">
                    <!-- Bubbles injected here -->
                </div>

                <div class="legend">
                    <div class="legend-item"><div class="legend-color" style="background: var(--success);"></div> Answered</div>
                    <div class="legend-item"><div class="legend-color" style="border: 1px solid var(--border-color);"></div> Not Answered</div>
                    <div class="legend-item"><div class="legend-color" style="border: 2px solid var(--primary);"></div> Current Question</div>
                </div>

                <button class="btn btn-primary" id="finishExamBtnSide" style="width: 100%; background: linear-gradient(135deg, var(--danger), #B91C1C);">Finish Exam</button>
            </div>
        </div>

    </main>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal animate-fade-in">
            <i class="fa-solid fa-triangle-exclamation text-gradient" style="font-size: 3rem; margin-bottom: 1rem;"></i>
            <h3>Submit Examination?</h3>
            <p style="color: var(--text-secondary); margin: 1rem 0 2rem;">Are you sure you want to finish? You still have <strong id="unansweredCountModal">0</strong> unanswered questions.</p>
            <div class="flex gap-4 justify-center">
                <button class="btn btn-outline" id="cancelSubmitBtn">Cancel</button>
                <button class="btn btn-primary" id="finalSubmitBtn">Yes, Submit</button>
            </div>
        </div>
    </div>

    <!-- Processing Modal -->
    <div class="modal-overlay" id="processingModal">
        <div class="modal animate-fade-in">
            <i class="fa-solid fa-spinner fa-spin text-gradient" style="font-size: 3rem; margin-bottom: 1rem;"></i>
            <h3>Evaluating Answers...</h3>
            <p style="color: var(--text-secondary); margin-top: 1rem;">Please wait while we process your results.</p>
        </div>
    </div>

    <script src="js/exam.js"></script>
</body>
</html>
