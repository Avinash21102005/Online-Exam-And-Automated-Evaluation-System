<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evalio | Authentication</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header .logo {
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .auth-header h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Mode Selector Tabs (Login / Register) */
        .mode-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .mode-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .btn-full {
            width: 100%;
            padding: 12px;
            margin-top: 1rem;
            font-size: 1rem;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Role Selector logic for Signup */
        .role-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .role-option {
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .role-option:hover {
            border-color: rgba(255,255,255,0.3);
        }

        .role-option.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            color: white;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card glass-panel animate-fade-in">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-graduation-cap text-gradient"></i>
                    Evalio
                </a>
                <h2 id="formTitle">Welcome Back</h2>
                <p id="formSubtitle">Please enter your credentials to continue</p>
            </div>

            <div class="mode-tabs" id="modeTabs">
                <div class="mode-tab active" data-mode="login">Sign In</div>
                <div class="mode-tab" data-mode="register">Sign Up</div>
            </div>

            <form id="authForm">
                
                <!-- Only visible on Signup -->
                <div id="signupFields" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" class="form-input" placeholder="John Doe">
                    </div>
                    
                    <label class="form-label">Account Type</label>
                    <div class="role-wrapper">
                        <div class="role-option selected" data-role="user">
                            <i class="fa-solid fa-user"></i> Student
                        </div>
                        <div class="role-option" data-role="admin">
                            <i class="fa-solid fa-shield-halved"></i> Admin
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="you@example.com">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>

                <div id="errorBox" class="error-message"></div>

                <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Sign In <i class="fa-solid fa-arrow-right ml-2" style="margin-left: 8px;"></i></button>
            </form>
            
        </div>
    </div>

    <!-- Replace data.js with direct auth backend calls -->
    <script src="js/auth.js"></script>
</body>
</html>
